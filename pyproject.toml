[project]
name = "audioscribe-benchmark"
version = "0.1.0"
description = "Benchmark pipeline for evaluating LLM-based transcription refinement of old samba lyrics"
requires-python = ">=3.11"
dependencies = [
    "openai>=1.0.0",
    "anthropic>=0.30.0",
    "google-genai>=1.0.0",
    "pydantic>=2.0.0",
    "pyyaml>=6.0",
    "python-dotenv>=1.0.0",
    "python-slugify>=8.0.0",
    "jiwer>=3.0.0",
    "bert-score>=0.3.13",
    "click>=8.0.0",
    "rich>=13.0.0",
    "jinja2>=3.0.0",
    "python-frontmatter>=1.0.0",
    "google-api-python-client>=2.0.0",
    "google-auth-httplib2>=0.1.0",
    "google-auth-oauthlib>=1.0.0",
    "demucs>=4.0.1",
    "soundfile>=0.13.1",
    "noisereduce>=3.0.3",
    "deepfilternet>=0.5.6",
    "numpy>=1.26.4",
    "scipy>=1.17.1",
]

[project.scripts]
benchmark = "benchmark.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/benchmark"]

[tool.ruff]
target-version = "py311"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "N", "W", "UP", "B", "C4", "PT"]

[tool.ruff.lint.isort]
known-first-party = ["benchmark"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

[dependency-groups]
dev = [
    "pytest>=8.0.0",
    "pytest-asyncio>=0.23.0",
    "pytest-mock>=3.12.0",
    "pytest-cov>=5.0.0",
    "ruff>=0.4.0",
]
voice-isolation = [
    "demucs>=4.0.0",
]
