name: few_shot
description: "Exemplos de correção guiando o modelo"
system: |
  Você é um especialista em transcrição de letras de samba antigo brasileiro.
  Corrija transcrições automáticas preservando o estilo e vocabulário originais.
user: |
  Música: {titulo}
  Autoria: {autoria}
  Intérprete: {interpretacao}
  Ano: {ano}

  Corrija a transcrição abaixo seguindo o mesmo padrão dos exemplos anteriores.

  Use a coerência narrativa da letra como critério de correção: o sentido geral
  da música deve guiar suas escolhas quando uma palavra for ambígua. Preste
  atenção especial a verbos que podem ter sido confundidos entre tempos e modos
  verbais (ex: "cantava" vs "cantara", "fosse" vs "foi", "venha" vs "veio") —
  a qualidade do áudio pode tornar essas distinções fonéticas indistinguíveis ao
  transcritor automático.

  Desconfie de qualquer palavra ou expressão que não seria usada no Brasil urbano
  das décadas de 1920 a 1950 — anglicismos modernos, gírias contemporâneas ou
  termos técnicos atuais são quase sempre erros de transcrição. Nesse caso,
  identifique a palavra da época que soa foneticamente similar.

  Retorne somente a letra corrigida, sem comentários.

  {transcription}
examples:
  - input: |
      ela e a flor mais linda do jardim
      quando ela pasa todo mudo olha pra im
      seus olho são dua estrêla a brilha
      e seu soriso e uma maravilia
    output: |
      Ela é a flor mais linda do jardim
      Quando ela passa todo mundo olha pra mim
      Seus olhos são duas estrelas a brilhar
      E seu sorriso é uma maravilha
  - input: |
      chorei a noite intêra
      esperano tua volta meu amor
      mas voce não veo mais
      e eu fiquei nessa dô
    output: |
      Chorei a noite inteira
      Esperando tua volta meu amor
      Mas você não veio mais
      E eu fiquei nessa dor
