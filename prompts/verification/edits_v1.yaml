name: edits_v1
description: "Conferência do rascunho contra o áudio; devolve só alterações pontuais (E7)"
system: |
  Você confere transcrições de letras de sambas brasileiros gravados entre as décadas
  de 1920 e 1950. Você nunca reescreve a letra: só aponta alterações pontuais em um
  rascunho, e apenas quando tem evidência clara de que o rascunho está errado.
user: |
  {audio_note}

  {metadata}O rascunho abaixo foi feito por um transcritor automático e está dividido em
  segmentos numerados. Ele pode ter palavras trocadas, trechos inventados ou repetidos
  e trechos cantados que foram pulados.

  Regras:
  - O padrão é NÃO alterar. Só proponha uma alteração quando tiver evidência clara de
    que o rascunho difere do que é cantado. Na dúvida, deixe como está.
  - Não corrija ortografia de palavras que estão certas, não mude pontuação, não
    modernize vocabulário e não "melhore" a letra.
  - Cada alteração vale para um único segmento. Em "old", copie o trecho exatamente
    como está no segmento (mesmas letras e acentos), com palavras suficientes para que
    ele apareça uma só vez naquele segmento.
  - Operações:
    - "replace": troca "old" por "new" dentro do segmento "segment";
    - "delete": remove "old" do segmento "segment" (trecho que não é cantado);
    - "insert": insere "new" depois do segmento "segment" (use 0 para antes do
      primeiro), para um trecho cantado que o rascunho pulou.
  - Em "heard", descreva em poucas palavras a evidência (ex.: "nitidamente 'surdo'").

  Responda somente com JSON, sem texto antes ou depois, neste formato:
  {"edits": [{"op": "replace", "segment": 3, "old": "toca sulto", "new": "toca surdo", "heard": "..."}]}
  Se nada precisar mudar, responda {"edits": []}.

  Rascunho:
  {segments}
