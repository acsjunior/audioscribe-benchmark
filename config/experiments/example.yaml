experiment_name: "experimento-01"

logging:
  mode: normal
  output_file: logs/experimento-01.log

retry:
  max_attempts: 3
  backoff_factor: 2.0

transcription:
  provider: whisper   # whisper | google | openai-audio (os dois últimos: LLM multimodal, ver MANUAL 5.2)
  model: whisper-1
  # Modelos (whisper): whisper-1, gpt-4o-transcribe, gpt-4o-mini-transcribe
  # Modelos (google): gemini-2.5-flash, ...   (openai-audio): gpt-audio, gpt-audio-mini
  #
  # Exemplo com gpt-4o-transcribe e prompt de contexto personalizado:
  # model: gpt-4o-transcribe
  # transcription_prompt: "Samba brasileiro antigo, vocabulário arcaico, português carioca."
  #
  # Quando model=gpt-4o-transcribe e transcription_prompt não é definido,
  # o pipeline usa automaticamente o prompt padrão do projeto.
  #
  # audio_preprocessing: demucs         # isola a voz
  # audio_preprocessing: noisereduce    # reduz ruído estacionário
  # audio_preprocessing: deepfilternet  # supressão de ruído com rede neural
  # Omitir ou deixar sem valor = sem pré-processamento (padrão)
  # Apenas uma opção pode ser usada por experimento.
  #
  runs: 1      # transcrições independentes por música; o refinamento roda em cada uma
  cache: true  # reaproveita transcrições salvas em data/transcriptions/
  # consensus: true  # adiciona o método "consensus" (medoide das rodadas); exige runs >= 3

refinement:
  - provider: openai
    model: gpt-4o
    prompt_file: prompts/minimalist.yaml

  - provider: openai
    model: gpt-4o
    prompt_file: prompts/rich_context.yaml

  - provider: anthropic
    model: claude-opus-4-7
    prompt_file: prompts/rich_context.yaml

  - provider: google
    model: gemini-2.0-flash
    prompt_file: prompts/rich_context.yaml

metrics:
  - wer
  - cer
  - bertscore

catalog_path: data/catalogo.csv
split: dev   # dev | test | all — o conjunto de teste só deve ser rodado na avaliação final

drive:
  credentials_path: credentials.json
  token_path: token.json
  audio_dir: data/inputs

results_path: results
