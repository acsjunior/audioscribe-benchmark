experiment_name: "teste2"

logging:
  mode: normal
  output_file: logs/teste2.log

retry:
  max_attempts: 2
  backoff_factor: 2.0

transcription:
  provider: whisper
  model: gpt-4o-transcribe
  transcription_prompt: "A gravação a seguir é de um samba brasileiro antigo, gravado entre as décadas de 1920 a 1950. O conteúdo da gravação inclui expressões típicas da época, como 'malandragem', 'almofadinha', 'orgia' e 'suite'."

refinement:
  - provider: openai
    model: gpt-4o
    prompt_file: prompts/rich_context_v2.yaml
  - provider: openai
    model: gpt-4o
    prompt_file: prompts/archaic_vocab_v2.yaml


metrics:
  - wer
  - cer

dataset_path: data/dataset
results_path: results